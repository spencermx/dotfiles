# Alacritty -- desktop.
#
# Colours are not set here. They come from one file under
# ~/.config/alacritty-themes/, chosen by the import below; swap it with
#
#     alacritty-theme <name>          # or with no argument, to list them
#
# Alacritty reloads on write, so the change lands in every open window at once.
[general]
import = ["~/.config/alacritty-themes/nord-legible.toml"]

[font]
size = 10.666666
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }

[selection]
save_to_clipboard = true

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
