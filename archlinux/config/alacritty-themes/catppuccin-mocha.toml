# Catppuccin Mocha -- Muted pastels on charcoal.
# Body text 11.3:1, dimmest accent 7.1:1 (red).
# Ratios are WCAG 2.1, measured against this file's own background.

[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"

[colors.normal]
black   = "#45475a"  # 1.8:1
red     = "#f38ba8"  # 7.1:1
green   = "#a6e3a1"  # 11.0:1
yellow  = "#f9e2af"  # 12.9:1
blue    = "#89b4fa"  # 7.8:1
magenta = "#f5c2e7"  # 10.7:1
cyan    = "#94e2d5"  # 11.0:1
white   = "#bac2de"  # 9.3:1

[colors.bright]
black   = "#585b70"  # 2.5:1
red     = "#f37799"  # 6.2:1
green   = "#89d88b"  # 9.6:1
yellow  = "#ebd391"  # 11.1:1
blue    = "#74a8fc"  # 6.8:1
magenta = "#f2aede"  # 9.3:1
cyan    = "#6bd7ca"  # 9.5:1
white   = "#a6adc8"  # 7.4:1
