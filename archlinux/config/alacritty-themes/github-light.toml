# GitHub Light -- Pure white, engineered for contrast.
# Body text 14.7:1, dimmest accent 4.9:1 (cyan).
# Ratios are WCAG 2.1, measured against this file's own background.

[colors.primary]
background = "#ffffff"
foreground = "#24292f"

[colors.normal]
black   = "#24292f"  # 14.7:1
red     = "#cf222e"  # 5.4:1
green   = "#116329"  # 7.4:1
yellow  = "#4d2d00"  # 12.4:1
blue    = "#0969da"  # 5.2:1
magenta = "#8250df"  # 5.0:1
cyan    = "#1b7c83"  # 4.9:1
white   = "#6e7781"  # 4.5:1

[colors.bright]
black   = "#57606a"  # 6.4:1
red     = "#a40e26"  # 7.9:1
green   = "#1a7f37"  # 5.1:1
yellow  = "#9a6700"  # 4.9:1
blue    = "#218bff"  # 3.4:1
magenta = "#8250df"  # 5.0:1
cyan    = "#3192aa"  # 3.6:1
white   = "#8c959f"  # 3.0:1
