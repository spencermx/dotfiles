# Solarized Light -- Low contrast by design.
# Body text 4.1:1, dimmest accent 2.9:1 (cyan).
# Ratios are WCAG 2.1, measured against this file's own background.

[colors.primary]
background = "#fdf6e3"
foreground = "#657b83"

[colors.normal]
black   = "#073642"  # 12.1:1
red     = "#dc322f"  # 4.3:1
green   = "#859900"  # 3.0:1
yellow  = "#b58900"  # 3.0:1
blue    = "#268bd2"  # 3.4:1
magenta = "#d33682"  # 4.2:1
cyan    = "#2aa198"  # 2.9:1
white   = "#eee8d5"  # 1.1:1

[colors.bright]
black   = "#002b36"  # 13.9:1
red     = "#cb4b16"  # 4.3:1
green   = "#586e75"  # 5.0:1
yellow  = "#657b83"  # 4.1:1
blue    = "#839496"  # 2.9:1
magenta = "#6c71c4"  # 4.1:1
cyan    = "#93a1a1"  # 2.5:1
white   = "#fdf6e3"  # 1.0:1
