# Nord -- Desaturated arctic blues.
# Body text 9.2:1, dimmest accent 3.1:1 (red).
# Ratios are WCAG 2.1, measured against this file's own background.

[colors.primary]
background = "#2e3440"
foreground = "#d8dee9"

[colors.normal]
black   = "#3b4252"  # 1.2:1
red     = "#bf616a"  # 3.1:1
green   = "#a3be8c"  # 6.1:1
yellow  = "#ebcb8b"  # 8.0:1
blue    = "#81a1c1"  # 4.6:1
magenta = "#b48ead"  # 4.4:1
cyan    = "#88c0d0"  # 6.2:1
white   = "#e5e9f0"  # 10.3:1

[colors.bright]
black   = "#4c566a"  # 1.7:1
red     = "#bf616a"  # 3.1:1
green   = "#a3be8c"  # 6.1:1
yellow  = "#ebcb8b"  # 8.0:1
blue    = "#81a1c1"  # 4.6:1
magenta = "#b48ead"  # 4.4:1
cyan    = "#8fbcbb"  # 6.0:1
white   = "#eceff4"  # 10.8:1
