# Modus Operandi -- Designed to WCAG AAA throughout.
# Body text 21.0:1, dimmest accent 8.0:1 (yellow).
# Ratios are WCAG 2.1, measured against this file's own background.

[colors.primary]
background = "#ffffff"
foreground = "#000000"

[colors.normal]
black   = "#000000"  # 21.0:1
red     = "#a60000"  # 8.0:1
green   = "#005e00"  # 8.1:1
yellow  = "#813e00"  # 8.0:1
blue    = "#0031a9"  # 10.4:1
magenta = "#721045"  # 11.2:1
cyan    = "#00538b"  # 8.0:1
white   = "#bfbfbf"  # 1.8:1

[colors.bright]
black   = "#595959"  # 7.0:1
red     = "#972500"  # 8.1:1
green   = "#315b00"  # 8.0:1
yellow  = "#70480f"  # 8.0:1
blue    = "#2544bb"  # 8.0:1
magenta = "#5317ac"  # 10.1:1
cyan    = "#005a5f"  # 8.0:1
white   = "#ffffff"  # 1.0:1
