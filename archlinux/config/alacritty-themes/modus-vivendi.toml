# Modus Vivendi -- Designed to WCAG AAA throughout.
# Body text 21.0:1, dimmest accent 8.5:1 (red).
# Ratios are WCAG 2.1, measured against this file's own background.

[colors.primary]
background = "#000000"
foreground = "#ffffff"

[colors.normal]
black   = "#000000"  # 1.0:1
red     = "#ff8059"  # 8.5:1
green   = "#44bc44"  # 8.5:1
yellow  = "#d0bc00"  # 10.9:1
blue    = "#2fafff"  # 8.7:1
magenta = "#feacd0"  # 12.0:1
cyan    = "#00d3d0"  # 11.2:1
white   = "#bfbfbf"  # 11.4:1

[colors.bright]
black   = "#595959"  # 3.0:1
red     = "#ef8b50"  # 8.5:1
green   = "#70b900"  # 8.6:1
yellow  = "#c0c530"  # 11.3:1
blue    = "#79a8ff"  # 8.9:1
magenta = "#b6a0ff"  # 9.5:1
cyan    = "#6ae4b9"  # 13.4:1
white   = "#ffffff"  # 21.0:1
