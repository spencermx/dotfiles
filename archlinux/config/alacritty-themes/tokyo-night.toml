# Tokyo Night -- Cool blue-black.
# Body text 10.6:1, dimmest accent 6.5:1 (red).
# Ratios are WCAG 2.1, measured against this file's own background.

[colors.primary]
background = "#1a1b26"
foreground = "#c0caf5"

[colors.normal]
black   = "#15161e"  # 1.1:1
red     = "#f7768e"  # 6.5:1
green   = "#9ece6a"  # 9.4:1
yellow  = "#e0af68"  # 8.5:1
blue    = "#7aa2f7"  # 6.8:1
magenta = "#bb9af7"  # 7.4:1
cyan    = "#7dcfff"  # 10.0:1
white   = "#a9b1d6"  # 8.1:1

[colors.bright]
black   = "#414868"  # 1.9:1
red     = "#f7768e"  # 6.5:1
green   = "#9ece6a"  # 9.4:1
yellow  = "#e0af68"  # 8.5:1
blue    = "#7aa2f7"  # 6.8:1
magenta = "#bb9af7"  # 7.4:1
cyan    = "#7dcfff"  # 10.0:1
white   = "#c0caf5"  # 10.6:1
