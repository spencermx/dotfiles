blue    = "#076678"  # 5.8:1
magenta = "#8f3f71"  # 5.9:1
cyan    = "#427b58"  # 4.4:1
white   = "#7c6f64"  # 4.3:1

[colors.bright]
black   = "#928374"  # 3.2:1
red     = "#cc241d"  # 4.8:1
