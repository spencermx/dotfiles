# Gruvbox Light -- Warm cream, dark accent set.
# Body text 10.2:1, dimmest accent 3.3:1 (yellow).
# Ratios are WCAG 2.1, measured against this file's own background.

[colors.primary]
background = "#fbf1c7"
foreground = "#3c3836"

[colors.normal]
