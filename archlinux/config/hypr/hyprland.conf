###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = ALT  # SUPER Sets "Windows" key as main modifier

bind = $mainMod, E, exec, $fileManager
bind = $mainMod, D, exec, $menu
bind = $mainMod, h, movefocus, l # Move focus with mainMod + arrow keys
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d
bind = $mainMod, 1, workspace, 1 # Switch workspaces with mainMod + [0-9]
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1 # Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10
bind = $mainMod SHIFT, h, movewindow, l # Move windows with mainMod + SHIFT + h/j/k/l
bind = $mainMod SHIFT, j, movewindow, d
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, l, movewindow, r
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ # Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86AudioNext, exec, playerctl next # Requires playerctl
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bind = $mainMod, Return, exec, $terminal #----------- CUSTOM ---------
bind = $mainMod SHIFT, Q, killactive,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, a, exec, pgrep hyprpaper && pkill hyprpaper || hyprpaper &
bind = $mainMod SHIFT, e, exec, loginctl terminate-user $(whoami)
bind = , F10, exec, brightnessctl set +5% # Brightness control bindings
bind = , F9, exec, brightnessctl set 5%-
bind=$mainMod, g, layoutmsg, preselect d # split horizontally i.e split across a horizontal line # Preselect split direction for next window 
bind=$mainMod, v, layoutmsg, preselect r # split vertically i.e. split across a vertical line 
bind=$mainMod, x, layoutmsg, togglesplit r # toggles the split (top/side) of the current window. preserve_split must be enabled for toggling to work.  
bind=$mainMod, s, layoutmsg, swapsplit s # swaps the two halves of the split of the current window.
bind = , Print, exec, hyprshot -m output -o ~/Pictures # Capture entire monitor # Screenshots
bind = SHIFT, PRINT, exec, hyprshot -m region --freeze -o ~/Pictures
bind = $mainMod, R, submap, resize # Resize windows with mainMod + R followed by h/j/k/l (hold to repeat)
submap = resize
bindr = , h, resizeactive, -10 0 # Resize bindings: h (shrink width), l (expand width), k (shrink height), j (expand height)
bindr = , l, resizeactive, 10 0
bindr = , k, resizeactive, 0 -10
bindr = , j, resizeactive, 0 10
bind = , escape, submap, reset # Exit resize mode
bind = , return, submap, reset
submap = reset
# Example special workspace (scratchpad)
bind = $mainMod, w, togglespecialworkspace, magic
bind = $mainMod SHIFT, w, movetoworkspacesilent, special:magic
bind = $mainMod, a, togglefloating,
bindm = $mainMod, mouse:272, movewindow
#bind = $mainMod, M, exit,
#bind = $mainMod, P, pseudo, # dwindle
env = JAVA_HOME,/usr/lib/jvm/java-17-openjdk
