# This zone's own tmux config, because this machine has no clipboard.
#
# Everything shared lives in common/config/.tmux.conf, linked to
# ~/.tmux.conf.common and pulled in below -- the same include pattern the
# .gitconfig split uses, rather than a 150-line duplicate that drifts.
#
# Overrides go AFTER the source-file line, where they win.

source-file ~/.tmux.conf.common

# The shared file picks pbcopy or xclip. There is neither here: no display
# server means no selection to own, and a physical TTY swallows OSC 52 rather
# than passing it to a host terminal. Copy stays inside tmux, which is the
# whole clipboard on this machine -- prefix-] pastes it back.
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# The Linux console has no scrollback of its own; the kernel dropped it in 5.9.
# tmux's history is the only way to look at anything that has left the screen,
# so it is far larger here than the 2000-line default.
set -g history-limit 100000

# prefix-] pastes the newest buffer and nothing else, and the shared config
# spends prefix-= on select-layout, so tmux's default buffer picker is
# unreachable. On a machine where these buffers ARE the clipboard, reaching an
# older one is not a luxury.
bind-key B choose-buffer

# Paste without the buffer's trailing newline running the line immediately --
# on a shell prompt a captured line ends in \n, which submits it before it can
# be edited. -p uses bracketed paste, so it arrives as text to look at first.
bind-key ] paste-buffer -p

# On this console-only machine tmux windows are the workspace layer. Select
# them directly, like a graphical window manager would, instead of requiring
# prefix-number for every switch. These root-table bindings take precedence
# over application Alt-number shortcuts by design.
bind-key -n M-1 select-window -t :1
bind-key -n M-2 select-window -t :2
bind-key -n M-3 select-window -t :3
bind-key -n M-4 select-window -t :4
bind-key -n M-5 select-window -t :5
bind-key -n M-6 select-window -t :6
bind-key -n M-7 select-window -t :7
bind-key -n M-8 select-window -t :8
bind-key -n M-9 select-window -t :9
bind-key -n M-0 select-window -t :10

# Step through adjacent workspace windows without the prefix.
bind-key -n 'M-[' previous-window
bind-key -n 'M-]' next-window

# Shift the current workspace window left or right in the status-line order.
# These are Alt-Shift-[ and Alt-Shift-] on a US keyboard.
bind-key -n 'M-{' swap-window -d -t -1
bind-key -n 'M-}' swap-window -d -t +1

# Direct versions of the existing prefix-c and prefix-x workflow.
bind-key -n M-c new-window
bind-key -n M-x kill-pane

# tmux buffers are this machine's clipboard. Make the common paste operation
# direct while retaining prefix-] and prefix-B for fallback and older buffers.
# -p uses bracketed paste so a trailing newline is inserted rather than
# immediately executing a command at a shell prompt.
bind-key -n M-v paste-buffer -p
