# Per-machine Sway output settings for "deb" (ASRock X870E Nova WiFi, desktop).
#
# Linked to ~/.config/sway/local.conf by 2-link-dotfiles.sh, which picks the
# file in this folder matching `hostname -s`. sway/config includes that path.
# A machine with no file here gets no link and no include, which is fine.
#
# Keep machine-specific things here -- connector names, modes, scale, monitor
# layout. Nothing in this file is portable: the outputs are these two panels,
# matched by make/model/serial rather than connector name so that moving a
# cable to another port (the ASUS went DP-2 -> DP-1 once already, silently
# dropping it back to scale 1.0 and 60Hz) does not unmatch the block.
# `swaymsg -t get_outputs` prints the identifier of each display.

# Both displays are 27" 4K, about 164 DPI. At the default scale 1.0 every UI
# element renders at roughly 59% of its intended physical size, which is why
# text looked small everywhere except the terminal, whose font had been
# manually inflated to compensate (see commit 7e2238c, which undid that).
# scale 1.5 gives ~110 effective DPI and a 2560x1440 logical desktop per
# screen, so the fonts in the shared configs can stay at ordinary values.
#
# Both panels are high-refresh but fall back to 60Hz unless a mode is stated.
#
# NOTE: position is in LOGICAL pixels, so the right-hand output starts at
# x=2560, not x=3840 (3840 / scale). Update it if the scale changes.

# Left: ASUS XG27UCDMG, 4K 240Hz OLED
output "ASUSTek COMPUTER INC XG27UCDMG T1LMAS022922" {
    mode 3840x2160@240.000Hz
    position 0 0
    scale 1.5
    adaptive_sync on
}

# Right: Samsung Odyssey G81SF, 4K 120Hz.
# adaptive_sync is requested but the driver declines it over HDMI; sway
# reports adaptive_sync_status=disabled for this output. Harmless, left in
# place so it engages if that changes.
output "Samsung Electric Company Odyssey G81SF HNAY402361" {
    mode 3840x2160@120.000Hz
    position 2560 0
    scale 1.5
    adaptive_sync on
}

# Pin workspaces so they do not shuffle when one display wakes up slowly.
# These apply as each workspace is created, so an already-open workspace
# stays where it is until the next login.
workspace 1 output "ASUSTek COMPUTER INC XG27UCDMG T1LMAS022922"
workspace 2 output "ASUSTek COMPUTER INC XG27UCDMG T1LMAS022922"
workspace 3 output "ASUSTek COMPUTER INC XG27UCDMG T1LMAS022922"
workspace 4 output "ASUSTek COMPUTER INC XG27UCDMG T1LMAS022922"
workspace 5 output "ASUSTek COMPUTER INC XG27UCDMG T1LMAS022922"
workspace 6 output "Samsung Electric Company Odyssey G81SF HNAY402361"
