# Same look as alacritty.toml. foot is here for yazi's image previews, which
# Alacritty can't draw.
[main]
font=JetBrains Mono:size=13
pad=3x3
selection-target=clipboard

[text-bindings]
# Shift+Enter sends a newline to Claude Code, as in alacritty.toml
\x1b\x0d=Shift+Return

